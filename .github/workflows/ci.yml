name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install
      - name: Typecheck frontend (svelte-check + tsc)
        working-directory: apps/frontend
        run: bun run check
      - name: Build frontend
        working-directory: apps/frontend
        run: bun run build

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install
      - name: Typecheck backend (tsc --noEmit)
        working-directory: apps/backend
        run: bunx tsc --noEmit